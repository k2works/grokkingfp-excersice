name: Test All Languages

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/test-all.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/test-all.yml'
  workflow_dispatch:

jobs:
  scala:
    name: Scala Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v15
        with:
          name: devenv
        continue-on-error: true
      - name: Run Scala tests
        run: |
          cd app/scala
          nix develop ../../#scala --command sbt test

  java:
    name: Java Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v15
        with:
          name: devenv
        continue-on-error: true
      - name: Run Java tests
        run: |
          cd app/java
          chmod +x gradlew
          nix develop ../../#java --command ./gradlew test

  rust:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v15
        with:
          name: devenv
        continue-on-error: true
      - name: Run Rust tests
        run: |
          cd app/rust
          nix develop ../../#rust --command cargo test

  python:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v15
        with:
          name: devenv
        continue-on-error: true
      - name: Run Python tests
        run: |
          cd app/python
          nix develop ../../#python --command bash -c "uv sync && uv run pytest"

  typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v15
        with:
          name: devenv
        continue-on-error: true
      - name: Run TypeScript tests
        run: |
          cd app/typescript
          nix develop ../../#typescript --command bash -c "npm ci && npm test"

  haskell:
    name: Haskell Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v15
        with:
          name: devenv
        continue-on-error: true
      - name: Run Haskell tests
        run: |
          cd app/haskell
          nix develop ../../#haskell --command stack test

  clojure:
    name: Clojure Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v15
        with:
          name: devenv
        continue-on-error: true
      - name: Run Clojure tests
        run: |
          cd app/clojure
          nix develop ../../#clojure --command clojure -X:test

  elixir:
    name: Elixir Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v15
        with:
          name: devenv
        continue-on-error: true
      - name: Run Elixir tests
        run: |
          cd app/elixir
          nix develop ../../#elixir --command mix test

  ruby:
    name: Ruby Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v15
        with:
          name: devenv
        continue-on-error: true
      - name: Run Ruby tests
        run: |
          cd app/ruby
          nix develop ../../#ruby --command bash -c "bundle install && bundle exec rspec"

  fsharp:
    name: F# Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v15
        with:
          name: devenv
        continue-on-error: true
      - name: Run F# tests
        run: |
          cd app/fsharp
          nix develop ../../#fsharp --command dotnet test

  csharp:
    name: C# Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v15
        with:
          name: devenv
        continue-on-error: true
      - name: Run C# tests
        run: |
          cd app/csharp
          nix develop ../../#csharp --command dotnet test

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [scala, java, rust, python, typescript, haskell, clojure, elixir, ruby, fsharp, csharp]
    if: always()
    steps:
      - name: Check test results
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Language | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Scala | ${{ needs.scala.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Java | ${{ needs.java.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Rust | ${{ needs.rust.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python | ${{ needs.python.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| TypeScript | ${{ needs.typescript.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Haskell | ${{ needs.haskell.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Clojure | ${{ needs.clojure.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Elixir | ${{ needs.elixir.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Ruby | ${{ needs.ruby.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| F# | ${{ needs.fsharp.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| C# | ${{ needs.csharp.result }} |" >> $GITHUB_STEP_SUMMARY
